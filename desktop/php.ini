; php.ini de la app de escritorio. main.js añade al arrancar las rutas absolutas
; (extension_dir, curl.cainfo y openssl.cafile) con la opción -d.
[PHP]
engine = On
short_open_tag = Off
memory_limit = 1024M
max_execution_time = 0
max_input_time = -1
post_max_size = 256M
upload_max_filesize = 256M
output_buffering = 0
implicit_flush = On
zlib.output_compression = Off
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED
default_charset = "UTF-8"
date.timezone = UTC

extension = curl
extension = openssl
extension = mbstring
extension = fileinfo
extension = pdo_sqlite
extension = sqlite3
; Solo para el script que importa los chats de MySQL (server/tools/importar-mysql.php)
extension = pdo_mysql
